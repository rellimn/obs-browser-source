services:
  sources:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    expose:
      - "8888"

    tmpfs:
      - /tmp:size=32m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 100
    mem_limit: 128m
    cpus: 1.0

    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obs-sources.rule=Host(`${OBS_SOURCES_HOST}`)"
      - "traefik.http.routers.obs-sources.entrypoints=websecure"
      - "traefik.http.routers.obs-sources.tls=true"
      - "traefik.http.routers.obs-sources.tls.certresolver=letsencrypt"
      - "traefik.http.routers.obs-sources.middlewares=secure-headers@file,rate-limit@file"
      - "traefik.http.services.obs-sources.loadbalancer.server.port=8888"

networks:
  proxy:
    external: true
    name: proxy