worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;
    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # TLS is terminated by the reverse proxy on the external proxy network.
        # Relative redirects preserve the public scheme and port.
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Inline scripts and external polling are required by the OBS pages.
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;

        # Filenames are not versioned: revalidate cached files after edits.
        # ETag/Last-Modified allow unchanged files to return 304 responses.
        expires -1;
        etag on;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Do not expose hidden files, backup files, or source configuration.
        location ~ /\. {
            return 404;
        }

        location ~* (?:~|\.(?:bak|old|orig|swp|sql|ini|log))$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
